# POC convenience: build + run, bind-mounting your Documents directory.
# Override DOCS_HOST to point at the folder of .md files you want to review.
services:
  stylus-md-markup:
    build: .
    ports:
      # host port overridable: HOST_PORT=8095 docker compose up
      - "${HOST_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DOCS_DIR=/docs
      - JOBS_DIR=/jobs
      # post-back to md-paste (ADR-0006, repointed kobo-1127). MDPASTE_API_KEY is
      # a secret injected at runtime (coolify) — never commit it. Without it,
      # publish AND the "?src=" external-md read proxy are both skipped.
      - MDPASTE_API_KEY=${MDPASTE_API_KEY:-}
      - MDPASTE_BASE_URL=${MDPASTE_BASE_URL:-https://paste.codechill.io}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://ink.notscam.space}
      - POSTBACK_TTL_HOURS=${POSTBACK_TTL_HOURS:-720}
      # "once" = 1 ref per job (skip re-append on repeat saves); "always" = history
      - POSTBACK_APPEND_MODE=${POSTBACK_APPEND_MODE:-once}
      # Review Desk surface (ADR-0002) — set on the DESK coolify app only
      # (review.notscam.space). Token-only mode: no passphrase; a review is opened
      # by its /r/:token capability link. Secret/maw injected at runtime, never
      # committed. Unset → maw routes return 503.
      - MAW_REVIEW_DESK_SECRET=${MAW_REVIEW_DESK_SECRET:-}
      - MAW_BASE_URL=${MAW_BASE_URL:-}
    volumes:
      # markdown Backdrop source -> /docs, mounted READ-ONLY (ADR-0002):
      # the tool physically cannot modify the author's source files.
      - ${DOCS_HOST:-./docs-sample}:/docs:ro
      # separate writable store for Markup Jobs (strokes + md + tiles).
      - ${JOBS_HOST:-./jobs-data}:/jobs
